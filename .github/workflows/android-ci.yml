name: Android CI

on:
  push:
    # Feature branches are checked by pull_request to avoid duplicate runs.
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Unit tests
            id: unit-tests
            tasks: :app:testDebugUnitTest
          - name: Android Lint
            id: lint
            tasks: :app:lintDebug
          - name: Build debug APKs
            id: build
            tasks: :app:assembleDebug :app:assembleDebugAndroidTest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep in sync with gradle/gradle-daemon-jvm.properties.
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # JVM tests use the bundled dictionary and do not need model.onnx.
      # Compile device tests here; running them needs a device and the model.
      - name: Run ${{ matrix.name }}
        run: >-
          ./gradlew --no-daemon --console=plain --stacktrace --continue
          ${{ matrix.tasks }}

      - name: Upload test and lint reports
        if: always() && matrix.id != 'build'
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports-${{ matrix.id }}
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

  # Keep the existing check name for branch protection rules.
  check:
    name: Unit tests, lint and build
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
